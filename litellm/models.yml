providers:
  # LiteLLM (omniroute üzerinden Cursor). apiKey önce ortam değişkeni adı olarak okunur, yoksa değerin kendisidir.
  litellm:
    baseUrl: <LiteLLM adresi>/v1
    apiKey: "LITELLM_API_KEY"
    # Seviyeler omniroute kataloğundan (models-yml-uret.py). Bunlar olmadan omp :high/:max göndermez.
    modelOverrides:
